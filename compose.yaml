name: eventcore

x-eventcore: &eventcore
  image: eventcore:local
  build: .
  profiles: [app]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment: &eventcore-environment
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    EVENTCORE_API_KEY_PEPPERS: ${EVENTCORE_API_KEY_PEPPERS:?EVENTCORE_API_KEY_PEPPERS is required}
    EVENTCORE_ACTIVE_API_KEY_PEPPER: ${EVENTCORE_ACTIVE_API_KEY_PEPPER:?EVENTCORE_ACTIVE_API_KEY_PEPPER is required}
    EVENTCORE_TRACING_SAMPLING_PROBABILITY: ${EVENTCORE_TRACING_SAMPLING_PROBABILITY:-0.1}

services:
  api:
    <<: *eventcore
    environment:
      <<: *eventcore-environment
      EVENTCORE_ROLES: api
      EVENTCORE_BOOTSTRAP_ADMIN_KEY: ${EVENTCORE_BOOTSTRAP_ADMIN_KEY:-}
      EVENTCORE_WEBHOOK_SECRET_KEYS: ${EVENTCORE_WEBHOOK_SECRET_KEYS:?EVENTCORE_WEBHOOK_SECRET_KEYS is required}
      EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY: ${EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY:?EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${EVENTCORE_API_PORT:-8080}:8080"
      - "127.0.0.1:${EVENTCORE_API_MANAGEMENT_PORT:-8081}:8081"

  relay:
    <<: *eventcore
    environment:
      <<: *eventcore-environment
      EVENTCORE_ROLES: relay

  worker:
    <<: *eventcore
    environment:
      <<: *eventcore-environment
      EVENTCORE_ROLES: worker
      EVENTCORE_WEBHOOK_SECRET_KEYS: ${EVENTCORE_WEBHOOK_SECRET_KEYS:?EVENTCORE_WEBHOOK_SECRET_KEYS is required}
      EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY: ${EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY:?EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY is required}

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
