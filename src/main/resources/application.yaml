spring:
  application:
    name: eventcore
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
    requested-heartbeat: 15s

server:
  port: 8080
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

springdoc:
  paths-to-match: /v1/**, /admin/**

eventcore:
  security:
    api-key-peppers: ${EVENTCORE_API_KEY_PEPPERS:}
    active-api-key-pepper: ${EVENTCORE_ACTIVE_API_KEY_PEPPER:}
    bootstrap-admin-key: ${EVENTCORE_BOOTSTRAP_ADMIN_KEY:}
    webhook-secret-keys: ${EVENTCORE_WEBHOOK_SECRET_KEYS:}
    active-webhook-secret-key: ${EVENTCORE_ACTIVE_WEBHOOK_SECRET_KEY:}
